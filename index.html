
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta Digital | Personalizable</title>
    
    <!-- Google Fonts: Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        :root {
            --gold: #D4AF37;
            --gold-light: #F1D592;
            --gold-dark: #B8860B;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0a0a0a;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }

        .bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0.4;
            z-index: -2;
            transition: background-image 0.5s ease-in-out;
        }

        .bg-gradient-dark {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6), rgba(0,0,0,0.4), rgba(0,0,0,0.8));
            z-index: -1;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            border-radius: 2.5rem;
            width: 100%;
            max-width: 420px;
            padding: 3rem 2rem;
            margin: 2rem 1rem;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.8s ease-out forwards;
        }

        @keyframes fadeIn { to { opacity: 1; transform: translateY(0); } }

        .gold-gradient { background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 50%, var(--gold-dark) 100%); }
        .gold-text { color: var(--gold); }

        .btn-action {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .btn-action:active { transform: scale(0.95); background: rgba(255, 255, 255, 0.15); }

        #editor-panel {
            position: fixed;
            top: 0; right: -100%;
            width: 100%; max-width: 380px;
            height: 100vh;
            background: rgba(10, 10, 10, 0.98);
            backdrop-filter: blur(25px);
            z-index: 100;
            transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-y: auto;
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2rem;
        }
        #editor-panel.open { right: 0; }

        .input-group { margin-bottom: 1.25rem; }
        .input-group label { display: block; font-size: 10px; color: var(--gold); text-transform: uppercase; margin-bottom: 4px; font-weight: bold; letter-spacing: 0.1em; }
        .input-group input, .input-group textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 12px;
            border-radius: 8px;
            color: white;
            font-size: 12px;
            outline: none;
        }
        .input-group input:focus { border-color: var(--gold); }

        /* Estilo para los botones de upload */
        .file-upload-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            background: rgba(212, 175, 55, 0.1);
            border: 1px dashed var(--gold);
            border-radius: 8px;
            color: var(--gold);
            font-size: 10px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 6px;
            text-transform: uppercase;
            transition: background 0.3s ease;
        }
        .file-upload-btn:hover { background: rgba(212, 175, 55, 0.2); }

        #btn-settings {
            position: fixed;
            top: 1.5rem; right: 1.5rem;
            z-index: 60;
            background: rgba(212, 175, 55, 0.2);
            width: 50px; height: 50px;
            border-radius: 50%;
            display: none;
            align-items: center; justify-content: center;
            backdrop-filter: blur(10px);
            border: 2px solid var(--gold);
            cursor: pointer;
            color: white;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }

        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.03);
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .switch { position: relative; display: inline-block; width: 34px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333; transition: .4s; border-radius: 20px;
        }
        .slider:before {
            position: absolute; content: "";
            height: 14px; width: 14px; left: 3px; bottom: 3px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--gold); }
        input:checked + .slider:before { transform: translateX(14px); }

        .admin-hint {
            position: fixed;
            bottom: 10px;
            width: 100%;
            text-align: center;
            font-size: 8px;
            color: rgba(255,255,255,0.1);
            pointer-events: none;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body>

    <button id="btn-settings" title="Abrir Configuración">
        <i class="fa-solid fa-gear"></i>
    </button>

    <aside id="editor-panel">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-xl font-bold gold-text">Editor Maestro</h2>
            <button onclick="toggleEditor()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
        </div>

        <div class="p-5 bg-white/5 border border-white/10 rounded-2xl mb-8">
            <h3 class="text-[10px] gold-text uppercase font-bold mb-2 tracking-widest">Paso 1: Guardar Cambios</h3>
            <button onclick="saveChanges()" class="w-full py-4 gold-gradient text-black font-extrabold rounded-xl text-xs uppercase shadow-xl mb-4">
                <i class="fa-solid fa-floppy-disk mr-2"></i> Guardar en mi Celular
            </button>
            
            <h3 class="text-[10px] gold-text uppercase font-bold mb-2 tracking-widest">Paso 2: Compartir con Clientes</h3>
            <button onclick="generateShareLink()" class="w-full py-3 bg-white/10 border border-white/20 text-white font-bold text-[10px] uppercase rounded-lg hover:bg-white/20 transition-all">
                <i class="fa-solid fa-paper-plane mr-2"></i> Copiar Link para Clientes
            </button>
        </div>

        <!-- IDENTIDAD -->
        <h3 class="text-[10px] gold-text uppercase mb-4 tracking-[0.3em] font-bold">Identidad</h3>
        <div class="input-group"><label>Nombre</label><input type="text" data-key="name"></div>
        <div class="input-group"><label>Cargo</label><input type="text" data-key="role"></div>
        <div class="input-group"><label>Biografía</label><textarea data-key="bio" rows="2"></textarea></div>
        
        <div class="input-group">
            <label>Foto de Perfil</label>
            <input type="text" data-key="photo" id="input-photo-url" placeholder="Link de la imagen">
            <label class="file-upload-btn">
                <i class="fa-solid fa-camera mr-2"></i> Subir Foto de Perfil
                <input type="file" class="hidden" accept="image/*" onchange="handleFileUpload(this, 'photo')">
            </label>
        </div>

        <hr class="border-white/10 my-6">

        <!-- APARIENCIA -->
        <h3 class="text-[10px] gold-text uppercase mb-4 tracking-[0.3em] font-bold">Apariencia</h3>
        <div class="input-group">
            <label>Imagen de Fondo</label>
            <input type="text" data-key="bgImg" id="input-bg-url" placeholder="Link del fondo">
            <label class="file-upload-btn">
                <i class="fa-solid fa-image mr-2"></i> Subir Imagen de Fondo
                <input type="file" class="hidden" accept="image/*" onchange="handleFileUpload(this, 'bgImg')">
            </label>
        </div>

        <hr class="border-white/10 my-6">
        
        <h3 class="text-[10px] gold-text uppercase mb-4 tracking-[0.3em] font-bold">Botones y Links</h3>
        <div class="input-group"><label>WhatsApp (solo números)</label><input type="text" data-key="whatsapp"></div>
        <div class="input-group"><label>Link Facebook</label><input type="text" data-key="facebook"></div>
        <div class="input-group"><label>Link Web</label><input type="text" data-key="site"></div>
        <div class="input-group"><label>Link Google Maps</label><input type="text" data-key="maps"></div>

        <hr class="border-white/10 my-6">
        <h3 class="text-[10px] gold-text uppercase mb-4 tracking-[0.3em] font-bold">Visibilidad</h3>
        <div class="toggle-row"><span>WhatsApp</span><label class="switch"><input type="checkbox" data-key="showWa"><span class="slider"></span></label></div>
        <div class="toggle-row"><span>Facebook</span><label class="switch"><input type="checkbox" data-key="showFb"><span class="slider"></span></label></div>
        <div class="toggle-row"><span>Ubicación</span><label class="switch"><input type="checkbox" data-key="showMaps"><span class="slider"></span></label></div>
        <div class="toggle-row"><span>Sitio Web</span><label class="switch"><input type="checkbox" data-key="showSite"><span class="slider"></span></label></div>
        
        <div class="mt-10 mb-20">
            <button onclick="resetDefaults()" class="w-full py-3 text-red-400 font-bold text-[10px] uppercase">Resetear Todo al Original</button>
        </div>
    </aside>

    <div class="bg-overlay" id="ui-bg-overlay"></div>
    <div class="bg-gradient-dark"></div>

    <main class="glass-card flex flex-col items-center gap-10">
        <header class="flex flex-col items-center text-center">
            <div class="relative mb-6">
                <div class="absolute inset-0 gold-gradient rounded-full blur-[3px]"></div>
                <img id="ui-photo" src="" alt="Perfil" onclick="handleSecretTap()" class="relative w-36 h-36 rounded-full border-4 border-[#D4AF37] object-cover shadow-2xl cursor-pointer">
            </div>
            <h1 id="ui-name" class="text-3xl font-bold tracking-tight mb-2 text-white"></h1>
            <p id="ui-role" class="gold-text text-sm font-semibold uppercase tracking-[0.25em] mb-4"></p>
            <div class="w-12 h-[1px] bg-white/20 mb-4"></div>
            <p id="ui-bio" class="text-gray-300 text-sm italic font-light max-w-[300px] leading-relaxed"></p>
        </header>

        <section id="ui-actions-grid" class="grid grid-cols-2 gap-4 w-full">
            <a id="link-wa" href="#" target="_blank" class="btn-action flex flex-col items-center justify-center py-5 px-2 rounded-2xl text-white">
                <i class="fa-brands fa-whatsapp text-2xl mb-2 text-green-400"></i>
                <span class="text-[10px] font-bold uppercase tracking-[0.1em]">WhatsApp</span>
            </a>
            <a id="link-fb" href="#" target="_blank" class="btn-action flex flex-col items-center justify-center py-5 px-2 rounded-2xl text-white">
                <i class="fa-brands fa-facebook text-2xl mb-2 text-blue-500"></i>
                <span class="text-[10px] font-bold uppercase tracking-[0.1em]">Facebook</span>
            </a>
            <a id="link-maps" href="#" target="_blank" class="btn-action flex flex-col items-center justify-center py-5 px-2 rounded-2xl text-white">
                <i class="fa-solid fa-location-dot text-2xl mb-2 text-red-400"></i>
                <span class="text-[10px] font-bold uppercase tracking-[0.1em]">Ubicación</span>
            </a>
            <a id="link-site" href="#" target="_blank" class="btn-action flex flex-col items-center justify-center py-5 px-2 rounded-2xl text-white">
                <i class="fa-solid fa-globe text-2xl mb-2 text-white"></i>
                <span class="text-[10px] font-bold uppercase tracking-[0.1em]">Sitio Web</span>
            </a>
        </section>

        <button id="btn-vcard" class="w-full py-5 gold-gradient rounded-2xl text-black font-extrabold text-sm tracking-[0.2em] uppercase shadow-[0_15px_30px_rgba(212,175,55,0.25)]">
            <i class="fa-solid fa-id-card-clip mr-2"></i>
            Guardar Contacto
        </button>

        <footer class="pt-4 border-t border-white/10 w-full">
            <p class="text-[9px] text-gray-500 font-medium tracking-[0.4em] uppercase text-center">
                © 2026 Universal Centro
            </p>
        </footer>
    </main>

    <div class="admin-hint">Tip: Toca 5 veces la foto de perfil</div>

    <script>
        const STORAGE_KEY = 'vcard_pro_v11';
        const defaultConfig = {
            name: "Ricardo Silva",
            role: "Asesor Inmobiliario de Lujo",
            bio: "\"Transformando sueños en direcciones exclusivas.\"",
            photo: "https://images.unsplash.com/photo-1560250097-0b93528c311a?auto=format&fit=crop&q=80&w=256&h=256",
            bgImg: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&q=80&w=1920",
            whatsapp: "5511999999999",
            facebook: "https://facebook.com",
            site: "https://www.ricardosilva.com.br",
            maps: "https://maps.google.com",
            showWa: true, showFb: true, showMaps: true, showSite: true
        };

        let config = defaultConfig;
        let tapCount = 0;
        let tapTimer = null;

        function encodeData(obj) { return btoa(unescape(encodeURIComponent(JSON.stringify(obj)))); }
        function decodeData(str) { return JSON.parse(decodeURIComponent(escape(atob(str)))); }

        function handleSecretTap() {
            tapCount++;
            clearTimeout(tapTimer);
            tapTimer = setTimeout(() => { tapCount = 0; }, 2000);
            if (tapCount >= 5) {
                document.getElementById('btn-settings').style.display = 'flex';
                alert("¡Modo Administrador Activado!");
                tapCount = 0;
            }
        }

        function handleFileUpload(input, key) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64Image = e.target.result;
                    config[key] = base64Image;
                    // Actualizar el campo de texto para mostrar que hay algo cargado
                    const inputTarget = document.querySelector(`input[data-key="${key}"]`);
                    if(inputTarget) inputTarget.value = "Imagen Cargada (Local)";
                    updateUI();
                };
                reader.readAsDataURL(file);
            }
        }

        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const sharedData = urlParams.get('d');
            if (sharedData) {
                try {
                    config = decodeData(sharedData);
                } catch (e) {
                    config = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultConfig;
                }
            } else {
                config = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultConfig;
            }

            if (urlParams.has('admin')) {
                document.getElementById('btn-settings').style.display = 'flex';
            }

            updateUI();
            syncEditor();
        }

        function updateUI() {
            document.getElementById('ui-name').innerText = config.name;
            document.getElementById('ui-role').innerText = config.role;
            document.getElementById('ui-bio').innerText = config.bio;
            document.getElementById('ui-photo').src = config.photo;
            document.getElementById('ui-bg-overlay').style.backgroundImage = `url('${config.bgImg || defaultConfig.bgImg}')`;
            
            document.getElementById('link-wa').href = `https://wa.me/${config.whatsapp}`;
            document.getElementById('link-fb').href = config.facebook;
            document.getElementById('link-site').href = config.site;
            document.getElementById('link-maps').href = config.maps;

            document.getElementById('link-wa').style.display = config.showWa ? 'flex' : 'none';
            document.getElementById('link-fb').style.display = config.showFb ? 'flex' : 'none';
            document.getElementById('link-maps').style.display = config.showMaps ? 'flex' : 'none';
            document.getElementById('link-site').style.display = config.showSite ? 'flex' : 'none';
        }

        function syncEditor() {
            document.querySelectorAll('#editor-panel [data-key]').forEach(el => {
                const key = el.getAttribute('data-key');
                if (el.type === 'checkbox') el.checked = !!config[key];
                else el.value = config[key] && config[key].startsWith('data:image') ? "Imagen Cargada (Local)" : (config[key] || "");
            });
        }

        function saveChanges() {
            document.querySelectorAll('#editor-panel [data-key]').forEach(el => {
                const key = el.getAttribute('data-key');
                if (el.type === 'checkbox') config[key] = el.checked;
                else {
                    // Solo actualizamos si no dice "Imagen Cargada" (para no borrar el base64 accidentalmente)
                    if (el.value !== "Imagen Cargada (Local)") {
                        config[key] = el.value;
                    }
                }
            });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
            updateUI();
            alert('¡Guardado localmente! Ahora puedes generar el link de compartir.');
        }

        function generateShareLink() {
            saveChanges();
            const b64 = encodeData(config);
            const baseUrl = window.location.href.split('?')[0];
            const shareUrl = `${baseUrl}?d=${b64}`;
            navigator.clipboard.writeText(shareUrl).then(() => {
                alert("¡Link de compartir copiado! Envíalo por WhatsApp a tus clientes.");
            });
        }

        function toggleEditor() { document.getElementById('editor-panel').classList.toggle('open'); }
        document.getElementById('btn-settings').addEventListener('click', toggleEditor);

        function resetDefaults() {
            if(confirm('¿Borrar todo?')) {
                config = {...defaultConfig};
                localStorage.removeItem(STORAGE_KEY);
                updateUI();
                syncEditor();
                location.reload();
            }
        }

        document.getElementById('btn-vcard').addEventListener('click', function() {
            const vcard = `BEGIN:VCARD\nVERSION:3.0\nFN:${config.name}\nTEL;TYPE=CELL:+${config.whatsapp}\nEND:VCARD`;
            const blob = new Blob([vcard], { type: 'text/vcard' });
            const url = window.URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `Contacto.vcf`;
            link.click();
        });

        init();
    </script>
</body>
</html>
